<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no"
      name="viewport"
    />
    <title>Welcome!</title>
    <style>
      body {
        margin: 0;
        background-color: #000;
        display: grid;
        place-items: center;
        <!-- min-height: 100vh; -->
        overflow: hidden;
      }
      .game {
        <!-- --base-size: 512px; -->
        width: round(down, 100%, var(--base-size));
        <!-- max-width: round(down, 80vh, var(--base-size)); -->
        height: auto;
        aspect-ratio: 1/1;
        margin: 0 auto;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        image-rendering: -moz-crisp-edges;
        -ms-interpolation-mode: nearest-neighbor;
      }
    </style>
  </head>
  <body>
    <canvas
      class="game"
      height="512"
      id="canvas"
      oncontextmenu="event.preventDefault()"
      tabindex="-1"
      width="512"
    ></canvas>
    <script>
      var Module = {
        preRun: [],
        postRun: [],
        print: function (n) {
          ((n = Array.prototype.slice.call(arguments).join(" ")),
            console.log(n));
        },
        printErr: function (n) {
          ((n = Array.prototype.slice.call(arguments).join(" ")),
            console.error(n));
        },
        canvas: (function () {
          var n = document.getElementById("canvas");
          return (
            window.addEventListener("load", () => n.focus()),
            window.addEventListener("click", () => n.focus()),
            n.addEventListener("click", () => n.focus()),
            n
          );
        })(),
        canvas: document.getElementById("canvas"),
        setStatus: function (n) {
          console.log("status: " + n);
        },
        monitorRunDependencies: function (n) {
          console.log("monitor run deps: " + n);
        },
      };
      window.onerror = function () {
        console.log("onerror: " + event.message);
      };
    </script>
    <script async src="enjohm.js"></script>
  </body>
</html>

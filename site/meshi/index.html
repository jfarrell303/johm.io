<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no"
      name="viewport"
    />
    <title>Welcome!</title>
    <style>
      body {
        margin: 0;
        background-color: #000;
        display: grid;
        place-items: center;
        min-height: 100vh;
        overflow: hidden;
      }
      .game {
        width: 512px;
        height: 512px;
        max-width: 100%;
        max-height: 100vh;
        object-fit: contain;
        margin: 0 auto;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        image-rendering: -moz-crisp-edges;
        -ms-interpolation-mode: nearest-neighbor;
      }
    </style>
  </head>
  <body>
    <canvas
      class="game"
      height="512"
      id="canvas"
      oncontextmenu="event.preventDefault()"
      tabindex="-1"
      width="512"
    ></canvas>
    <script>
      var canvasElement = document.getElementById("canvas");
      ["load", "click"].forEach(function (evt) {
        window.addEventListener(evt, function () {
          if (canvasElement) canvasElement.focus();
        });
      });

      var Module = {
        preRun: [],
        postRun: [],
        print: function (n) {
          n = Array.prototype.slice.call(arguments).join(" ");
          console.log(n);
        },
        printErr: function (n) {
          n = Array.prototype.slice.call(arguments).join(" ");
          console.error(n);
        },
        canvas: canvasElement,
        setStatus: function (n) {
          console.log("status: " + n);
        },
        monitorRunDependencies: function (n) {
          console.log("monitor run deps: " + n);
        },
      };

      window.onerror = function (message, source, lineno, colno, error) {
        console.log("onerror: " + (message || (error && error.message)));
      };
    </script>
    <script async src="enjohm.js"></script>
  </body>
</html>
